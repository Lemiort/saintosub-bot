[package]
name = "saintnosub-bot"
version = "1.2.1"
authors = ["Lemiort <lemiort@gmail.com>"]
edition = "2024"
rust-version = "1.99"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
teloxide = "0.17.0"
tokio = { version = "1.54.1", features = ["full"] }
rand = "0.10.3"
reqwest = { version = "0.13.5", features = ["json", "query"] }
serde = { version = "1.0.229", features = ["derive"] }
log = "0.4.35"
log4rs = { version = "1.4.0", default-features = false, features = ["console_appender", "file_appender", "pattern_encoder"] }
dotenvy = "0.15.7"

[dev-dependencies]
serde_json = "1.0.154"
